# canonmark 的反馈链路（远端）：两道彼此解耦的检查。
#   tests      —— 审计器自身的单测（含 fixture 双向 oracle），保工具质量。
#   self-audit —— canonmark 用自己审自己的 docs，保文档治理（dogfood）。
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # 声称支持的每个 Python 版本都真跑一遍——requires-python 说 >=3.9,
    # 就不许只测 3.11 然后让下游用户替我们发现 3.9 跑不起来。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[yaml]"
      - run: canon audit docs/ --config canonmark.toml
